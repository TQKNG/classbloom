name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository baseline
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE CONTRIBUTING.md AGENTS.md CLAUDE.md .github/copilot-instructions.md .github/pull_request_template.md .github/ISSUE_TEMPLATE/bug_report.md .github/ISSUE_TEMPLATE/feature_request.md; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          if grep -R -n '{{[A-Z_]*}}' README.md LICENSE CONTRIBUTING.md .github/ISSUE_TEMPLATE .github/pull_request_template.md; then
            echo 'Unresolved scaffold placeholders found.'
            exit 1
          fi

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
